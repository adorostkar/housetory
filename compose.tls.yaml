# Optional direct-TLS deployment. Apply after creating a trusted certificate:
#
#   WEB_BIND=0.0.0.0 WEB_PORT=80 WEB_TLS_PORT=443 \
#   APP_BASE_URL=https://inventory.example.com COOKIE_SECURE=true \
#   TLS_CERT_PATH=/etc/letsencrypt/live/inventory.example.com/fullchain.pem \
#   TLS_KEY_PATH=/etc/letsencrypt/live/inventory.example.com/privkey.pem \
#   docker compose -f compose.yaml -f compose.tls.yaml up -d --build
#
# Port 8080 only redirects to HTTPS except for the /healthz probe. PostgreSQL and
# worker services are not published.
services:
  web:
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_TLS_PORT:-443}:8443"
    volumes:
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH to a PEM certificate chain}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH to the matching PEM private key}:/etc/nginx/tls/tls.key:ro
      - ./infrastructure/docker/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
