name: housetory

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-build: &api-build
  context: .
  dockerfile: infrastructure/docker/api.Dockerfile

x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-housetory}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-housetory}
  ENVIRONMENT: production
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  DATA_DIR: /data
  UPLOADS_DIR: /data/uploads

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-housetory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-housetory}
    volumes:
      - housetory_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-housetory} -d ${POSTGRES_DB:-housetory}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  migrate:
    build: *api-build
    image: housetory-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging

  api:
    build: *api-build
    image: housetory-api:local
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - housetory_uploads:/data/uploads
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-housetory}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-housetory}
      ENVIRONMENT: production
      DATA_DIR: /data
      UPLOADS_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "housetory_worker.health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *default-logging

volumes:
  housetory_pgdata:
    name: housetory_pgdata
  housetory_uploads:
    name: housetory_uploads
