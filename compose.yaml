name: housetory

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-build: &api-build
  context: .
  dockerfile: infrastructure/docker/api.Dockerfile

x-app-database-url: &app-database-url "postgresql+psycopg://${HOUSETORY_APP_USER:?Set HOUSETORY_APP_USER in .env}:${HOUSETORY_APP_PASSWORD:?Set HOUSETORY_APP_PASSWORD in .env}@db:5432/${POSTGRES_DB:-housetory}"
x-admin-database-url: &admin-database-url "postgresql+psycopg://${POSTGRES_USER:-housetory}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-housetory}"

x-api-environment: &api-environment
  DATABASE_URL: *app-database-url
  ENVIRONMENT: production
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
  RELEASE_BUILD_TIME: ${RELEASE_BUILD_TIME:-unknown}
  RELEASE_CHANNEL: ${RELEASE_CHANNEL:-local}
  SERVER_IDENTITY: ${SERVER_IDENTITY:-}
  QR_BASE_URL: ${QR_BASE_URL:-}
  EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-10}
  LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
  DATA_DIR: /data
  UPLOADS_DIR: /data/uploads
  IMPORTS_DIR: /data/imports
  EXPORTS_DIR: /data/exports
  AI_CREDENTIAL_KEY: ${AI_CREDENTIAL_KEY:-}
  AI_CREDENTIAL_KEY_PREVIOUS: ${AI_CREDENTIAL_KEY_PREVIOUS:-}
  AI_PROVIDER: ${AI_PROVIDER:-disabled}
  AI_MODEL: ${AI_MODEL:-}
  AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
  AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-1}
  AI_CLOUD_ENABLED: ${AI_CLOUD_ENABLED:-false}
  AI_CLOUD_CONSENT: ${AI_CLOUD_CONSENT:-false}
  AI_CLOUD_BASE_URL: ${AI_CLOUD_BASE_URL:-}
  AI_CLOUD_MODEL: ${AI_CLOUD_MODEL:-}
  AI_CLOUD_API_KEY: ${AI_CLOUD_API_KEY:-}
  AI_MAX_CONTEXT_CHARS: ${AI_MAX_CONTEXT_CHARS:-12000}
  AI_IMPORT_MAX_CHUNKS: ${AI_IMPORT_MAX_CHUNKS:-8}
  MANUAL_SEARCH_PROVIDER: ${MANUAL_SEARCH_PROVIDER:-auto}
  MANUAL_SEARCH_URL: ${MANUAL_SEARCH_URL:-}
  MANUAL_SEARCH_API_KEY: ${MANUAL_SEARCH_API_KEY:-}
  MANUAL_SEARCH_PROVIDER_LABEL: ${MANUAL_SEARCH_PROVIDER_LABEL:-Configured manual search}
  MANUAL_SEARCH_TIMEOUT_SECONDS: ${MANUAL_SEARCH_TIMEOUT_SECONDS:-20}
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  BRAVE_SEARCH_BASE_URL: ${BRAVE_SEARCH_BASE_URL:-https://api.search.brave.com}
  BRAVE_SEARCH_COUNTRY: ${BRAVE_SEARCH_COUNTRY:-}
  BRAVE_SEARCH_LANG: ${BRAVE_SEARCH_LANG:-}
  ITEM_IMAGE_SEARCH_PROVIDER: ${ITEM_IMAGE_SEARCH_PROVIDER:-auto}
  ITEM_IMAGE_PERMITTED_SOURCE_DOMAINS: ${ITEM_IMAGE_PERMITTED_SOURCE_DOMAINS:-}
  ITEM_IMAGE_PERMITTED_LICENSES: ${ITEM_IMAGE_PERMITTED_LICENSES:-cc0,cc-by,cc-by-sa,public-domain}
  ITEM_IMAGE_MANUFACTURER_DOMAINS: ${ITEM_IMAGE_MANUFACTURER_DOMAINS:-}
  ITEM_IMAGE_KNOWN_BRANDS: ${ITEM_IMAGE_KNOWN_BRANDS:-}
  EVIDENCE_EXPORT_MAX_ITEMS: ${EVIDENCE_EXPORT_MAX_ITEMS:-300}
  EVIDENCE_EXPORT_MAX_DOCUMENTS: ${EVIDENCE_EXPORT_MAX_DOCUMENTS:-300}
  EVIDENCE_EXPORT_MAX_PHOTOS: ${EVIDENCE_EXPORT_MAX_PHOTOS:-500}
  EVIDENCE_EXPORT_MAX_BUNDLE_MB: ${EVIDENCE_EXPORT_MAX_BUNDLE_MB:-100}
  EVIDENCE_EXPORT_MAX_PDF_PHOTOS: ${EVIDENCE_EXPORT_MAX_PDF_PHOTOS:-60}
  EVIDENCE_EXPORT_RETENTION_HOURS: ${EVIDENCE_EXPORT_RETENTION_HOURS:-168}
  EVIDENCE_EXPORT_TIMEOUT_SECONDS: ${EVIDENCE_EXPORT_TIMEOUT_SECONDS:-180}
  STOCKTAKE_MAX_ITEMS: ${STOCKTAKE_MAX_ITEMS:-500}
  STOCKTAKE_MAX_APPLY_BATCH: ${STOCKTAKE_MAX_APPLY_BATCH:-200}
  STOCKTAKE_MAX_ACTIVE_SESSIONS: ${STOCKTAKE_MAX_ACTIVE_SESSIONS:-25}
  STOCKTAKE_MAX_NOTES_CHARS: ${STOCKTAKE_MAX_NOTES_CHARS:-2000}
  STOCKTAKE_MAX_OBSERVATIONS_PER_SESSION: ${STOCKTAKE_MAX_OBSERVATIONS_PER_SESSION:-2000}
  IMPORT_MAX_FILES: ${IMPORT_MAX_FILES:-2000}
  IMPORT_MAX_TOTAL_MB: ${IMPORT_MAX_TOTAL_MB:-50}
  IMPORT_MAX_FILE_MB: ${IMPORT_MAX_FILE_MB:-10}
  VOICE_MAX_UPLOAD_MB: ${VOICE_MAX_UPLOAD_MB:-15}
  VOICE_MAX_DURATION_SECONDS: ${VOICE_MAX_DURATION_SECONDS:-120}
  VOICE_MAX_ACTIVE_NOTES: ${VOICE_MAX_ACTIVE_NOTES:-10}
  VOICE_MAX_SUGGESTIONS: ${VOICE_MAX_SUGGESTIONS:-50}
  VOICE_MAX_TRANSCRIPT_CHARS: ${VOICE_MAX_TRANSCRIPT_CHARS:-12000}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Housetory}
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
  INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-168}
  PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}

services:
  db:
    build:
      context: .
      dockerfile: infrastructure/docker/db.Dockerfile
    image: housetory-db:local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-housetory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-housetory}
      HOUSETORY_APP_USER: ${HOUSETORY_APP_USER:?Set HOUSETORY_APP_USER in .env}
      HOUSETORY_APP_PASSWORD: ${HOUSETORY_APP_PASSWORD:?Set HOUSETORY_APP_PASSWORD in .env}
    volumes:
      - housetory_pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/initdb:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-housetory} -d ${POSTGRES_DB:-housetory}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  migrate:
    build: *api-build
    image: housetory-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *admin-database-url
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api:
    build: *api-build
    image: housetory-api:local
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - housetory_uploads:/data/uploads
      - housetory_imports:/data/imports
      - housetory_exports:/data/exports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *default-logging

  worker: &worker
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    environment: &worker-environment
      WORKER_QUEUE: default
      DATABASE_URL: *app-database-url
      ENVIRONMENT: production
      DATA_DIR: /data
      UPLOADS_DIR: /data/uploads
      IMPORTS_DIR: /data/imports
      EXPORTS_DIR: /data/exports
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng+swe}
      OCR_MAX_PDF_PAGES: ${OCR_MAX_PDF_PAGES:-5}
      AI_CREDENTIAL_KEY: ${AI_CREDENTIAL_KEY:-}
      AI_CREDENTIAL_KEY_PREVIOUS: ${AI_CREDENTIAL_KEY_PREVIOUS:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-1}
      AI_CLOUD_ENABLED: ${AI_CLOUD_ENABLED:-false}
      AI_CLOUD_CONSENT: ${AI_CLOUD_CONSENT:-false}
      AI_CLOUD_BASE_URL: ${AI_CLOUD_BASE_URL:-}
      AI_CLOUD_MODEL: ${AI_CLOUD_MODEL:-}
      AI_CLOUD_API_KEY: ${AI_CLOUD_API_KEY:-}
      AI_MAX_CONTEXT_CHARS: ${AI_MAX_CONTEXT_CHARS:-12000}
      AI_IMPORT_MAX_CHUNKS: ${AI_IMPORT_MAX_CHUNKS:-8}
      MANUAL_SEARCH_PROVIDER: ${MANUAL_SEARCH_PROVIDER:-auto}
      MANUAL_SEARCH_URL: ${MANUAL_SEARCH_URL:-}
      MANUAL_SEARCH_API_KEY: ${MANUAL_SEARCH_API_KEY:-}
      MANUAL_SEARCH_PROVIDER_LABEL: ${MANUAL_SEARCH_PROVIDER_LABEL:-Configured manual search}
      MANUAL_SEARCH_TIMEOUT_SECONDS: ${MANUAL_SEARCH_TIMEOUT_SECONDS:-20}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      BRAVE_SEARCH_BASE_URL: ${BRAVE_SEARCH_BASE_URL:-https://api.search.brave.com}
      BRAVE_SEARCH_COUNTRY: ${BRAVE_SEARCH_COUNTRY:-}
      BRAVE_SEARCH_LANG: ${BRAVE_SEARCH_LANG:-}
      ITEM_IMAGE_SEARCH_PROVIDER: ${ITEM_IMAGE_SEARCH_PROVIDER:-auto}
      ITEM_IMAGE_PERMITTED_SOURCE_DOMAINS: ${ITEM_IMAGE_PERMITTED_SOURCE_DOMAINS:-}
      ITEM_IMAGE_PERMITTED_LICENSES: ${ITEM_IMAGE_PERMITTED_LICENSES:-cc0,cc-by,cc-by-sa,public-domain}
      ITEM_IMAGE_MANUFACTURER_DOMAINS: ${ITEM_IMAGE_MANUFACTURER_DOMAINS:-}
      ITEM_IMAGE_KNOWN_BRANDS: ${ITEM_IMAGE_KNOWN_BRANDS:-}
      IMPORT_MAX_FILES: ${IMPORT_MAX_FILES:-2000}
      IMPORT_MAX_TOTAL_MB: ${IMPORT_MAX_TOTAL_MB:-50}
      IMPORT_MAX_FILE_MB: ${IMPORT_MAX_FILE_MB:-10}
      VOICE_MAX_UPLOAD_MB: ${VOICE_MAX_UPLOAD_MB:-15}
      VOICE_MAX_DURATION_SECONDS: ${VOICE_MAX_DURATION_SECONDS:-120}
      VOICE_MAX_ACTIVE_NOTES: ${VOICE_MAX_ACTIVE_NOTES:-10}
      VOICE_MAX_SUGGESTIONS: ${VOICE_MAX_SUGGESTIONS:-50}
      VOICE_MAX_TRANSCRIPT_CHARS: ${VOICE_MAX_TRANSCRIPT_CHARS:-12000}
      EVIDENCE_EXPORT_MAX_ITEMS: ${EVIDENCE_EXPORT_MAX_ITEMS:-300}
      EVIDENCE_EXPORT_MAX_DOCUMENTS: ${EVIDENCE_EXPORT_MAX_DOCUMENTS:-300}
      EVIDENCE_EXPORT_MAX_PHOTOS: ${EVIDENCE_EXPORT_MAX_PHOTOS:-500}
      EVIDENCE_EXPORT_MAX_BUNDLE_MB: ${EVIDENCE_EXPORT_MAX_BUNDLE_MB:-100}
      EVIDENCE_EXPORT_MAX_PDF_PHOTOS: ${EVIDENCE_EXPORT_MAX_PDF_PHOTOS:-60}
      EVIDENCE_EXPORT_RETENTION_HOURS: ${EVIDENCE_EXPORT_RETENTION_HOURS:-168}
      EVIDENCE_EXPORT_TIMEOUT_SECONDS: ${EVIDENCE_EXPORT_TIMEOUT_SECONDS:-180}
      STOCKTAKE_MAX_ITEMS: ${STOCKTAKE_MAX_ITEMS:-500}
      STOCKTAKE_MAX_APPLY_BATCH: ${STOCKTAKE_MAX_APPLY_BATCH:-200}
      STOCKTAKE_MAX_ACTIVE_SESSIONS: ${STOCKTAKE_MAX_ACTIVE_SESSIONS:-25}
      STOCKTAKE_MAX_NOTES_CHARS: ${STOCKTAKE_MAX_NOTES_CHARS:-2000}
      STOCKTAKE_MAX_OBSERVATIONS_PER_SESSION: ${STOCKTAKE_MAX_OBSERVATIONS_PER_SESSION:-2000}
    volumes:
      # Writable only for legitimate item-image maintenance/generation. The
      # worker still has a read-only root filesystem and no added capabilities.
      - housetory_uploads:/data/uploads
      - housetory_imports:/data/imports
      - housetory_exports:/data/exports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "housetory_worker.health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *default-logging

  ai-worker:
    <<: *worker
    environment:
      <<: *worker-environment
      WORKER_QUEUE: ai

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *default-logging

volumes:
  housetory_pgdata:
    name: housetory_pgdata
  housetory_uploads:
    name: housetory_uploads
  housetory_imports:
    name: housetory_imports
  housetory_exports:
    name: housetory_exports
